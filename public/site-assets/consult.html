<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>परामर्श कक्ष · Consultation room</title>
<link rel="stylesheet" href="/site-assets/styles.css?v=20260926-1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
<script src="/site-assets/app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.js"></script>
<style>
  .consult-room{max-width:760px;margin:0 auto;padding:20px;}
  .consult-videos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
  .consult-videos video{width:100%;aspect-ratio:4/3;background:#111;border-radius:10px;}
  .consult-controls{display:flex;gap:10px;flex-wrap:wrap;}
  .consult-lang{display:flex;gap:6px;margin-top:4px;}
  .consult-lang button{background:none;border:none;cursor:pointer;font-size:.8rem;color:var(--ink-soft);}
  .consult-lang button.active{color:var(--gold);font-weight:700;}
</style>
</head>
<body>
<main class="consult-room">
  <h2 id="crTitle"></h2>
  <div class="consult-lang" id="crLang"></div>
  <p id="crStatus" style="color:var(--ink-soft);"></p>
  <div class="consult-videos">
    <video id="crLocal" muted playsinline></video>
    <video id="crRemote" playsinline></video>
  </div>
  <audio id="crRemoteAudio"></audio>
  <div class="consult-controls">
    <button class="btn btn-ghost" id="crMic"></button>
    <button class="btn btn-ghost" id="crCam"></button>
    <button class="btn btn-gold" id="crLeave"></button>
  </div>
  <div id="crError"></div>
</main>
<script src="/site-assets/js/consult-room.js"></script>
</body>
</html>
